name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Run package tests
        run: swift test --package-path Core

  app:
    name: Build iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          latest=$(python3 - <<'PY'
          import glob, re

          def version(path):
              match = re.search(r"Xcode_([0-9.]+)\.app$", path)
              return tuple(int(part) for part in match.group(1).split(".")) if match else (0,)

          print(max(glob.glob("/Applications/Xcode_*.app"), key=version))
          PY
          )
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: Run core tests with Apple's toolchain
        run: swift test --package-path Core
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project TrayLog.xcodeproj \
            -scheme TrayLog \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
