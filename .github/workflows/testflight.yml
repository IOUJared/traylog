name: TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version (defaults to the tag or 1.0)"
        required: false
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 40
    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          missing=0
          for name in APPSTORE_KEY_ID APPSTORE_ISSUER_ID APPSTORE_PRIVATE_KEY DEVELOPMENT_TEAM; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. See docs/testflight.md."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install App Store Connect key
        run: |
          key_path="$RUNNER_TEMP/private_keys/AuthKey.p8"
          mkdir -p "$(dirname "$key_path")"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Resolve version
        run: |
          version="${{ inputs.marketing_version }}"
          if [ -z "$version" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "MARKETING_VERSION=${version:-1.0}" >> "$GITHUB_ENV"

      - name: Write export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>__TEAM_ID__</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/__TEAM_ID__/$DEVELOPMENT_TEAM/" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive
        run: |
          xcodebuild archive \
            -project TrayLog.xcodeproj \
            -scheme TrayLog \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TrayLog.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Automatic

      - name: Export and upload
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TrayLog.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      - name: Remove App Store Connect key
        if: always()
        run: |
          if [ -n "$KEY_PATH" ]; then
            rm -f "$KEY_PATH"
          fi
